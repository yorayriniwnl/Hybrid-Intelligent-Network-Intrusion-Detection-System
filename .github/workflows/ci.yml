name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  evidence-contract:
    name: Evidence & claim contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile project sources
        run: python -m compileall -q api backend src tests run_pipeline.py run_advanced_pipeline.py
      - name: Verify committed evidence contract
        run: python -m unittest tests.test_evidence_contract -v

  system-smoke:
    name: Model & API smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run system integration tests
        run: python -m unittest tests.test_system -v
